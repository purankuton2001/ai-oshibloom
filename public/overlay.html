<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI OshiBloom · OBS overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Noto Sans CJK JP','Noto Sans JP','Noto Sans KR',system-ui,sans-serif}.layer{position:absolute;inset:0}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 300ms ease}.media.visible{opacity:1}#fallback{opacity:1}#reaction{opacity:0;transition:opacity 300ms ease}#reaction.visible{opacity:1}#caption{position:absolute;left:7%;right:7%;bottom:10%;color:white;text-align:center;opacity:0;transition:opacity 300ms ease;text-shadow:0 2px 12px #162714}#caption.visible{opacity:1}#caption strong{font-size:clamp(15px,3vw,35px);font-weight:650;display:block;padding:10px;background:#263c2b9c;border-radius:10px;backdrop-filter:blur(8px)}#caption small{display:inline-block;font-size:clamp(10px,1.6vw,20px);padding:7px 14px;background:#263c2b88;border-radius:20px;margin-top:9px}#badge{position:absolute;right:18px;top:18px;background:#28372d75;color:#ffffffe0;font-size:11px;letter-spacing:.6px;border:1px solid #ffffff35;padding:5px 8px;border-radius:5px}#demo{position:absolute;left:18px;bottom:18px;color:#fffc;background:#28372d70;padding:4px 8px;border-radius:4px;font-size:10px}.preview #badge{top:53px;font-size:8px;right:18px}.preview #demo{display:none}.preview #caption{bottom:23%}.preview #caption strong{font-size:clamp(14px,3vw,24px)}.preview #caption small{font-size:11px}
